name: Deploy Fourier Canvas to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify math and JavaScript
        run: |
          node --check app.js
          node --check math.js
          node --test tests/*.test.cjs
      - uses: actions/configure-pages@v5
      - name: Package static website
        run: |
          mkdir _site
          cp index.html app.js math.js style.css icon.svg _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
